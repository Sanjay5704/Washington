[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "washington"
version = "0.1.0"
description = "Insider cluster-buy detection pipeline on SEC EDGAR Form 4 data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2.50", "pandas>=2.0"]
dashboard = ["streamlit>=1.40", "pandas>=2.0", "altair>=5"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
washington = "washington.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/logs", "airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a running PostgreSQL (set WASHINGTON_TEST_DB=1)"]
