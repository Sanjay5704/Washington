version: 2

sources:
  - name: silver
    description: Parsed, typed, de-duplicated Form 4 data loaded by the Python and PySpark jobs.
    schema: silver
    tables:
      - name: form4_filings
        columns:
          - name: accession_no
            data_tests: [unique, not_null]
          - name: issuer_cik
            data_tests: [not_null]
          - name: source
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["edgar_daily", "sec_dataset"]
      - name: form4_reporting_owners
      - name: form4_nonderiv_transactions
      - name: stock_prices

models:
  - name: stg_form4_filings
    description: One row per Form 4 filing.
    columns:
      - name: accession_no
        data_tests: [unique, not_null]
  - name: stg_form4_owners
    description: One row per (filing, reporting owner).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [accession_no, owner_cik]
  - name: stg_form4_transactions
    description: One row per non-derivative transaction line.
    columns:
      - name: transaction_key
        data_tests: [unique, not_null]
      - name: acquired_disposed
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "D"]
              config:
                where: "acquired_disposed is not null"
  - name: stg_stock_prices
    description: Daily adjusted close per ticker.

unit_tests:
  - name: test_clean_ticker
    description: Hand-typed trading symbols seen in real filings become one clean symbol.
    model: stg_form4_filings
    given:
      - input: source('silver', 'form4_filings')
        format: csv
        rows: |
          accession_no,document_type,issuer_ticker
          a1,4,aapl
          a2,4,NYSE: KRC
          a3,4,(SIRI)
          a4,4,"LEN, LEN.B"
          a5,4,Z AND ZG
          a6,4,N O G
          a7,4,MOGA/MOGB
          a8,4,BRK.B
          a9,4,NONE
          a10,4,--
    expect:
      format: csv
      rows: |
        accession_no,issuer_ticker
        a1,AAPL
        a2,KRC
        a3,SIRI
        a4,LEN
        a5,Z
        a6,NOG
        a7,MOGA
        a8,BRK.B
        a9,
        a10,
